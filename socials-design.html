<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose design | Fremantle Rebels Social Generator</title>
  <meta name="description" content="Pick a template, colours and format for your Fremantle Rebels social post.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Roboto+Slab:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/rebels-theme.css">
</head>
<body class="rebels-app">
  <a class="visually-hidden-focusable position-absolute p-3 bg-white text-dark" href="#main">Skip to content</a>

  <header class="rb-topbar">
    <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-2 py-3 px-4">
      <a class="rb-brand" href="index.html" aria-label="Fremantle Rebels home">
        <img src="assets/images/rebels-logo.png" alt="">
        <span><span class="name d-block">Fremantle</span><span class="sub">Social Generator</span></span>
      </a>
      <nav class="rb-topnav d-flex gap-2 flex-wrap" aria-label="Generator sections">
        <a class="nav-label" href="socials.html">Fixture / Result</a>
        <a class="nav-label active" href="socials-design.html" aria-current="page">Design</a>
        <a class="nav-label" href="socials-media.html">Media</a>
        <a class="nav-label" href="socials-export.html">Export</a>
      </nav>
    </div>
  </header>

  <div class="rb-shell container-fluid px-0">
    <main id="main">
      <div class="row g-0">

        <aside class="col-12 col-lg-2 rb-progress p-4" aria-labelledby="progress-heading">
          <h2 id="progress-heading" class="section-title fs-5 mb-4">Progress</h2>
          <ol class="rb-steps mb-4">
            <li class="done">Choose fixture</li>
            <li class="current">Choose design</li>
            <li>Choose media</li>
            <li>Caption &amp; export</li>
          </ol>
          <h3 class="label-xs">Selections</h3>
          <dl class="rb-summary mb-0" id="summary"></dl>
        </aside>

        <section class="col-12 col-md-7 col-lg-6 rb-preview-area p-4 d-flex flex-column align-items-center justify-content-center gap-3" aria-labelledby="preview-heading">
          <h2 id="preview-heading" class="visually-hidden">Post preview</h2>
          <div class="rb-canvas-wrap spatial-shadow">
            <canvas id="postCanvas" width="1080" height="1080" role="img" aria-label="Preview of the social media post"></canvas>
          </div>
          <p class="rb-hint mb-0" id="sizeHint">1080 × 1080 · updates live</p>
        </section>

        <section class="col-12 col-md-5 col-lg-4 p-4" aria-labelledby="editing-heading">
          <p class="hero-kicker mb-2">Step 2 of 4</p>
          <h2 id="editing-heading" class="section-title fs-2 mb-4">Choose <span class="accent">design</span></h2>

          <span class="label-xs" id="tplLabel">Template</span>
          <div class="row g-2 mb-4" id="templates" role="radiogroup" aria-labelledby="tplLabel"></div>

          <span class="label-xs">Colours</span>
          <div class="rb-segment mb-4" id="variants" role="radiogroup" aria-label="Colours"></div>

          <span class="label-xs">Format</span>
          <div class="rb-segment mb-4" id="formats" role="radiogroup" aria-label="Format"></div>

          <span class="label-xs">Team names</span>
          <div class="rb-segment mb-2" id="names" role="radiogroup" aria-label="Team name format">
            <button type="button" data-v="full">Full name</button>
            <button type="button" data-v="short">Short name</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="rb-actions">
      <div class="row g-0 align-items-center w-100">
        <div class="col-4"><a class="btn btn-outline-light" href="socials.html" id="back">Back</a></div>
        <div class="col-4 text-center"><button class="btn btn-outline-light" type="button" id="saveDraft">Save draft</button></div>
        <div class="col-4 text-end"><button class="btn btn-gold" type="button" id="next">Next: media</button></div>
      </div>
      <p id="status" class="rb-hint text-center mt-2 mb-0" role="status"></p>
    </footer>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/post-renderer.js"></script>
  <script src="assets/js/socials-design.js"></script>
</body>
</html>
